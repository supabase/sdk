name: Validate SDK compliance file
description: Validates the calling repo's compliance file against the capability spec. Expects the calling repo at the workspace root and the supabase/sdk checkout at _sdk-spec (the reusable workflows set both up).

inputs:
  compliance-file:
    description: Path to sdk-compliance.yaml in the calling repo
    default: sdk-compliance.yaml
  sdk-ref:
    description: Transitional: only set by pre-v1.4.0 reusable workflows that reference this action remotely. When non-empty, the action performs its own checkouts at this ref. Remove once every caller references the action locally.
    default: ""

runs:
  using: composite
  steps:
    # Transitional compatibility for pre-v1.4.0 reusable workflows: they
    # reference this action remotely (so nothing is checked out yet) and
    # always pass a non-empty sdk-ref. Current workflows perform both
    # checkouts themselves and leave sdk-ref empty.
    - name: Checkout SDK repo
      if: ${{ inputs.sdk-ref != '' }}
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Checkout capability spec
      if: ${{ inputs.sdk-ref != '' }}
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        repository: supabase/sdk
        ref: ${{ inputs.sdk-ref }}
        path: _sdk-spec

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "22"

    - name: Install dependencies
      shell: bash
      run: npm ci
      working-directory: _sdk-spec/packages/capability-matrix

    - name: Validate compliance file
      shell: bash
      env:
        COMPLIANCE_FILE: ${{ inputs.compliance-file }}
      run: npm run validate-compliance -- "$GITHUB_WORKSPACE/$COMPLIANCE_FILE"
      working-directory: _sdk-spec/packages/capability-matrix

name: Validate SDK compliance file
description: Validates the compliance file of the calling SDK repo against the capability spec. Expects the calling repo at the workspace root and this repo at _sdk-spec, both checked out by the caller.

inputs:
  compliance-file:
    description: Path to sdk-compliance.yaml in the calling repo
    default: sdk-compliance.yaml

runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "22"

    - name: Install dependencies
      shell: bash
      run: npm ci
      working-directory: _sdk-spec/scripts/capability-matrix

    - name: Validate compliance file
      shell: bash
      env:
        COMPLIANCE_FILE: ${{ inputs.compliance-file }}
      run: npm run validate-compliance -- "$GITHUB_WORKSPACE/$COMPLIANCE_FILE"
      working-directory: _sdk-spec/scripts/capability-matrix

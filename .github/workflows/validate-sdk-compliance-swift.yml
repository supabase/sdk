name: SDK Compliance — Swift (reusable)

on:
  workflow_call:
    inputs:
      compliance-file:
        description: Path to sdk-compliance.yaml in the calling repo
        type: string
        default: sdk-compliance.yaml
      sdk-ref:
        description: Ref to check out from supabase/sdk for the spec and scripts (defaults to the revision of this workflow file, so the caller's pin governs the spec too; override only during pre-merge testing)
        type: string
        default: ""

jobs:
  validate:
    name: Validate compliance file
    runs-on: ubuntu-latest
    steps:
      # The calling repo lands at the workspace root, so it has to come before
      # the spec: actions/checkout cleans the directory it manages, which would
      # delete an already-present _sdk-spec.
      - name: Checkout SDK repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Checkout capability spec
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: supabase/sdk
          ref: ${{ inputs.sdk-ref || github.job_workflow_sha }}
          path: _sdk-spec

      - uses: ./_sdk-spec/.github/actions/sdk-compliance-validate
        with:
          compliance-file: ${{ inputs.compliance-file }}

  check:
    name: Check public API against capability matrix
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Nothing else checks out at the workspace root here, so the spec can
      # come first, which it has to: the actions below are loaded from it.
      - name: Checkout capability spec
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: supabase/sdk
          ref: ${{ inputs.sdk-ref || github.job_workflow_sha }}
          path: _sdk-spec

      - uses: ./_sdk-spec/.github/actions/sdk-compliance-check-setup

      - name: Cache SPM dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            _sdk-pr/.build/repositories
            _sdk-base/.build/repositories
          key: spm-${{ runner.os }}-${{ hashFiles('_sdk-pr/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Extract Swift symbol graphs
        run: |
          for b in pr base; do
            cd "$GITHUB_WORKSPACE/_sdk-$b"
            # || true: test targets may fail to extract on CI runners; library targets land first
            swift package dump-symbol-graph \
              --minimum-access-level public \
              --skip-synthesized-members || true
            # Multi-target packages emit several symbolgraph dirs; collect every
            # symbols file across all of them (paths from .build never contain spaces).
            SGFILES=$(find .build -maxdepth 4 -name "*.symbols.json")
            if [ -z "$SGFILES" ]; then echo "::error::No symbol graphs emitted"; exit 1; fi
            jq -s '[.[] | .symbols[]]' $SGFILES \
              > "$GITHUB_WORKSPACE/$b-raw.json"
          done

      - name: Normalize Swift symbol graphs
        run: |
          for b in pr base; do
            npm run --silent normalize-symbolgraph -- \
              "$GITHUB_WORKSPACE/$b-raw.json" "$GITHUB_WORKSPACE/_sdk-$b" \
              > "$GITHUB_WORKSPACE/$b-symbols.json"
          done
        working-directory: _sdk-spec/scripts/capability-matrix

      - uses: ./_sdk-spec/.github/actions/sdk-compliance-check-symbols
        with:
          compliance-file: ${{ inputs.compliance-file }}

      - uses: ./_sdk-spec/.github/actions/sdk-compliance-check-drift
        with:
          compliance-file: ${{ inputs.compliance-file }}

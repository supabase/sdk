name: Release postgrest-typegen

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .release-please-manifest.postgrest-typegen.json

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['packages/postgrest-typegen--release_created'] }}
      tag_name: ${{ steps.release.outputs['packages/postgrest-typegen--tag_name'] }}
      version: ${{ steps.release.outputs['packages/postgrest-typegen--version'] }}
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.postgrest-typegen.json
          manifest-file: .release-please-manifest.postgrest-typegen.json
          target-branch: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}

  publish-postgrest-typegen:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/postgrest-typegen
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install latest npm for OIDC trusted publishing
        run: |
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Publish to npm
        run: npm publish --access public --provenance

  bump-typegen-pin:
    needs: [release-please, publish-postgrest-typegen]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/typegen
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Wait for the release to be served by npm
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          for attempt in $(seq 1 40); do
            if npm view "@supabase/postgrest-typegen@${VERSION}" version >/dev/null 2>&1; then
              exit 0
            fi
            echo "Attempt ${attempt}: @supabase/postgrest-typegen@${VERSION} is not on npm yet"
            sleep 15
          done
          echo "::error::@supabase/postgrest-typegen@${VERSION} did not appear on npm within 10 minutes"
          exit 1

      - name: Bump the pin
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: bun add --exact "@supabase/postgrest-typegen@${VERSION}"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          VERSION: ${{ needs.release-please.outputs.version }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- package.json bun.lock; then
            echo "packages/typegen already pins @supabase/postgrest-typegen@${VERSION}; nothing to do."
            exit 0
          fi

          branch="chore/typegen-postgrest-typegen-${VERSION}"
          title="fix(typegen): bump @supabase/postgrest-typegen to ${VERSION}"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "$(gh api "/users/${APP_SLUG}[bot]" --jq .id)+${APP_SLUG}[bot]@users.noreply.github.com"
          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          git checkout -b "$branch"
          git add package.json bun.lock
          git commit -m "$title"
          git push --force-with-lease origin "$branch"

          body="$(printf 'Bumps the exact pin in packages/typegen to the version published from %s.\n\nRelease notes: https://github.com/%s/releases/tag/%s' "$TAG_NAME" "$GITHUB_REPOSITORY" "$TAG_NAME")"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" ]; then
            echo "Pull request already open for $branch; pushed the update."
          else
            gh pr create --base "$BASE_BRANCH" --head "$branch" --title "$title" --body "$body"
          fi

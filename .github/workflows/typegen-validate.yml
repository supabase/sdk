name: Validate typegen

on:
  push:
    branches: [main]
    paths:
      - "packages/typegen/**"
      - ".github/workflows/typegen-validate.yml"
  pull_request:
    paths:
      - "packages/typegen/**"
      - ".github/workflows/typegen-validate.yml"

defaults:
  run:
    working-directory: packages/typegen

jobs:
  test:
    name: Types, lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check-types
      - run: bun run format-and-lint
      - run: bun run knip
      - run: bun run build
      - run: bun run test

name: SDK Compliance — Go (reusable)

on:
  workflow_call:
    inputs:
      compliance-file:
        description: Path to sdk-compliance.yaml in the calling repo
        type: string
        default: sdk-compliance.yaml
      sdk-ref:
        description: Ref to checkout from supabase/sdk for scripts (defaults to main; override only during pre-merge testing)
        type: string
        default: main

# The composite actions below are referenced by full commit SHA rather than
# a branch: a calling repository's actions policy applies transitively to
# these references, and enterprise policies can require every action to be
# pinned to a full-length SHA. The pin moves deliberately when the actions
# themselves change.
jobs:
  validate:
    name: Validate compliance file
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/sdk/.github/actions/sdk-compliance-validate@29e402daf432bccac26cfac1280b491b140d6d20 # v1.2.0
        with:
          compliance-file: ${{ inputs.compliance-file }}
          sdk-ref: ${{ inputs.sdk-ref }}

  # Unlike the other language workflows this one carries no drift step, so it
  # never posts PR comments and the job needs no pull-requests permission.
  # The blocking new-symbol check below already fails a PR that removes or
  # renames a registered symbol.
  check:
    name: Check public API against capability matrix
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: supabase/sdk/.github/actions/sdk-compliance-check-setup@29e402daf432bccac26cfac1280b491b140d6d20 # v1.2.0
        with:
          sdk-ref: ${{ inputs.sdk-ref }}

      # The Go extractor parses syntactically with the standard library's
      # go/parser, so the target checkouts need no dependency resolution and
      # the tool itself downloads nothing.
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          # Nothing to cache for a stdlib-only tool, and the default cache
          # warns on the run when it finds no dependencies file at the
          # workspace root (the checkouts here live in subdirectories).
          cache: false

      - name: Extract Go symbols
        run: |
          for b in pr base; do
            go run . "$GITHUB_WORKSPACE/_sdk-$b" \
              > "$GITHUB_WORKSPACE/$b-symbols.json"
          done
        working-directory: _sdk-spec/packages/go-symbol-extractor

      - uses: supabase/sdk/.github/actions/sdk-compliance-check-symbols@29e402daf432bccac26cfac1280b491b140d6d20 # v1.2.0
        with:
          compliance-file: ${{ inputs.compliance-file }}

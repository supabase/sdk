name: SDK Compliance — Go (reusable)

on:
  workflow_call:
    inputs:
      compliance-file:
        description: Path to sdk-compliance.yaml in the calling repo
        type: string
        default: sdk-compliance.yaml
      sdk-ref:
        description: Ref to checkout from supabase/sdk for tooling and spec (defaults to the commit this workflow was called at; override only during pre-merge testing)
        type: string
        default: ""

# Tooling, composite actions, and capability spec all resolve from the single
# supabase/sdk commit the caller pinned this workflow at (job.workflow_sha).
# `uses:` cannot carry an expression, so a remote action reference would
# freeze action code at some earlier release while the spec checkout moved
# independently. That skew is what broke consumers when the spec repo's
# layout changed. Checking out supabase/sdk once and referencing the actions locally
# keeps everything at one immutable SHA.
jobs:
  validate:
    name: Validate compliance file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Checkout compliance tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: supabase/sdk
          ref: ${{ inputs.sdk-ref || job.workflow_sha }}
          path: _sdk-spec
          persist-credentials: false

      - uses: ./_sdk-spec/packages/capability-matrix/actions/sdk-compliance-validate
        with:
          compliance-file: ${{ inputs.compliance-file }}

  # Unlike the other language workflows this one carries no drift step, so it
  # never posts PR comments and the job needs no pull-requests permission.
  # The blocking new-symbol check below already fails a PR that removes or
  # renames a registered symbol.
  check:
    name: Check public API against capability matrix
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout compliance tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: supabase/sdk
          ref: ${{ inputs.sdk-ref || job.workflow_sha }}
          path: _sdk-spec
          persist-credentials: false

      - uses: ./_sdk-spec/packages/capability-matrix/actions/sdk-compliance-check-setup

      # The Go extractor parses syntactically with the standard library's
      # go/parser, so the target checkouts need no dependency resolution and
      # the tool itself downloads nothing.
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          # Nothing to cache for a stdlib-only tool, and the default cache
          # warns on the run when it finds no dependencies file at the
          # workspace root (the checkouts here live in subdirectories).
          cache: false

      - name: Extract Go symbols
        run: |
          for b in pr base; do
            go run . "$GITHUB_WORKSPACE/_sdk-$b" \
              > "$GITHUB_WORKSPACE/$b-symbols.json"
          done
        working-directory: _sdk-spec/packages/go-symbol-extractor

      - uses: ./_sdk-spec/packages/capability-matrix/actions/sdk-compliance-check-symbols
        with:
          compliance-file: ${{ inputs.compliance-file }}

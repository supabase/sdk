name: Validate Capabilities

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "packages/capability-matrix/**"
      - "packages/dart-symbol-extractor/**"
      - "packages/go-symbol-extractor/**"
      - ".github/workflows/capability-matrix-validate.yml"
  schedule:
    - cron: "0 6 * * *" # nightly drift sweep

defaults:
  run:
    working-directory: packages/capability-matrix

jobs:
  structural:
    name: Tier 1 (structural)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: packages/capability-matrix/.bun-version
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: bun run format-and-lint
      - run: bun run knip
      - run: bun run validate

  dart-parser:
    name: Dart parser (format, analyze, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - working-directory: packages/dart-symbol-extractor
        run: dart pub get
      - working-directory: packages/dart-symbol-extractor
        run: dart format --output=none --set-exit-if-changed .
      - working-directory: packages/dart-symbol-extractor
        run: dart analyze
      - working-directory: packages/dart-symbol-extractor
        run: dart test

  go-parser:
    name: Go parser (format, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          # Nothing to cache for a stdlib-only tool, and the default cache
          # warns on the run when it finds no dependencies file at the
          # repository root (the module lives under packages/).
          cache: false
      - working-directory: packages/go-symbol-extractor
        run: test -z "$(gofmt -l .)"
      - working-directory: packages/go-symbol-extractor
        run: go vet ./...
      - working-directory: packages/go-symbol-extractor
        run: go test ./...

  references:
    name: Tier 2 (references)
    runs-on: ubuntu-latest
    needs: structural
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: packages/capability-matrix/.bun-version
      - run: bun install --frozen-lockfile
      - name: Validate references (changed files on PR, all files nightly)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run validate:online

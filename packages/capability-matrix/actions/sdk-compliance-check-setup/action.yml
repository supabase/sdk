name: Set up SDK compliance public API check
description: Checks out the current SDK tree and, for additions mode on pull requests, its base tree. Expects the supabase/sdk checkout at _sdk-spec.

inputs:
  compliance-file:
    description: Path to sdk-compliance.yaml in the calling repo
    default: sdk-compliance.yaml
  api-paths:
    description: >-
      Newline-separated git pathspecs that can change the public API. When set,
      a pull request that touches none of them (nor the compliance file) skips
      the check. Empty disables the gate.
    default: ""
  warm-cache:
    description: >-
      Set to "true" when the caller wants pushes to the default branch in additions
      mode to run the expensive extraction once, so it can save caches for later
      pull requests.
    default: "false"

outputs:
  coverage-mode:
    description: The resolved API coverage mode
    value: ${{ steps.coverage.outputs.mode }}
  should-run:
    description: Whether the public API check applies to this event
    value: ${{ steps.coverage.outputs.should-run == 'true' && steps.paths.outputs.changed != 'false' && 'true' || 'false' }}
  path-skipped:
    description: Whether the path gate skipped a pull request that touches no public API paths
    value: ${{ steps.paths.outputs.changed == 'false' && 'true' || 'false' }}
  warm:
    description: Whether this run only warms caches for later pull requests (push event in additions mode with warm-cache enabled)
    value: ${{ steps.coverage.outputs.warm }}

runs:
  using: composite
  steps:
    - name: Checkout current SDK tree
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        path: _sdk-pr

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: latest

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
      working-directory: _sdk-spec/packages/capability-matrix

    - name: Read API coverage mode
      id: coverage
      shell: bash
      env:
        COMPLIANCE_FILE: ${{ inputs.compliance-file }}
        WARM_CACHE: ${{ inputs.warm-cache }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        MODE=$(bun run --silent coverage-mode -- "$GITHUB_WORKSPACE/_sdk-pr/$COMPLIANCE_FILE")
        echo "mode=$MODE" >> "$GITHUB_OUTPUT"
        # Caches saved from other refs are unreadable by pull requests and only evict
        # the useful ones, so only the default branch warms them.
        if [ "$WARM_CACHE" = "true" ] && [ "$MODE" = "additions" ] && [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
          echo "warm=true" >> "$GITHUB_OUTPUT"
        else
          echo "warm=false" >> "$GITHUB_OUTPUT"
        fi
        if [ "$MODE" = "additions" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
          echo "should-run=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipping additions-mode API check outside a pull request"
        else
          echo "should-run=true" >> "$GITHUB_OUTPUT"
        fi
      working-directory: _sdk-spec/packages/capability-matrix

    - name: Skip when the pull request cannot change the public API
      id: paths
      if: steps.coverage.outputs.should-run == 'true' && inputs.api-paths != '' && github.event_name == 'pull_request'
      shell: bash
      env:
        API_PATHS: ${{ inputs.api-paths }}
        COMPLIANCE_FILE: ${{ inputs.compliance-file }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        CHANGED=true
        # The default pull request checkout is the merge commit, so diffing it
        # against the base commit lists exactly the files the pull request changes.
        # Any failure leaves CHANGED=true, so the check runs rather than being skipped.
        if git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
          PATHSPECS=()
          while IFS= read -r line; do
            if [ -n "$line" ]; then PATHSPECS+=("$line"); fi
          done <<< "$API_PATHS"
          PATHSPECS+=("$COMPLIANCE_FILE")
          if DIFF=$(git diff --name-only "$BASE_SHA" HEAD -- "${PATHSPECS[@]}"); then
            if [ -z "$DIFF" ]; then CHANGED=false; fi
          fi
        fi
        echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
        if [ "$CHANGED" = "false" ]; then
          echo "::notice::No public API paths changed; skipping the public API check"
        fi
      working-directory: _sdk-pr

    - name: Checkout base SDK tree
      if: steps.coverage.outputs.mode == 'additions' && github.event_name == 'pull_request' && steps.paths.outputs.changed != 'false'
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: _sdk-base

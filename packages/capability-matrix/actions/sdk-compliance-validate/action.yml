name: Validate SDK compliance file
description: Validates the calling repo's compliance file against the capability spec. Expects the calling repo at the workspace root and the supabase/sdk checkout at _sdk-spec (the reusable workflows set both up).

inputs:
  compliance-file:
    description: Path to sdk-compliance.yaml in the calling repo
    default: sdk-compliance.yaml
runs:
  using: composite
  steps:
    - name: Install bun
      shell: bash
      run: curl -fsSL https://bun.sh/install | bash -s "bun-v$(cat _sdk-spec/packages/capability-matrix/.bun-version)"
    - name: Add bun to PATH
      shell: bash
      run: echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
      working-directory: _sdk-spec/packages/capability-matrix

    - name: Validate compliance file
      shell: bash
      env:
        COMPLIANCE_FILE: ${{ inputs.compliance-file }}
      run: bun run validate-compliance -- "$GITHUB_WORKSPACE/$COMPLIANCE_FILE"
      working-directory: _sdk-spec/packages/capability-matrix

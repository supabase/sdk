name: Check public symbols against capability matrix
description: Checks the current public API using the coverage mode declared in sdk-compliance.yaml.

inputs:
  compliance-file:
    description: Path to sdk-compliance.yaml in the calling repo
    default: sdk-compliance.yaml

runs:
  using: composite
  steps:
    - name: Check new symbols against capability matrix
      shell: bash
      env:
        COMPLIANCE_FILE: ${{ inputs.compliance-file }}
      run: |
        BASE_SYMBOLS="$GITHUB_WORKSPACE/base-symbols.json"
        if [ ! -f "$BASE_SYMBOLS" ]; then
          BASE_SYMBOLS="-"
        fi
        npm run check-api-symbols -- \
          "$GITHUB_WORKSPACE/pr-symbols.json" \
          "$BASE_SYMBOLS" \
          "$GITHUB_WORKSPACE/_sdk-pr/$COMPLIANCE_FILE"
      working-directory: _sdk-spec/packages/capability-matrix

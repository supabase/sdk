# PostgREST and PostgreSQL for the end-to-end tests. Start with
# `bun run e2e:up`, stop with `bun run e2e:down`.
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./fixture.sql:/docker-entrypoint-initdb.d/fixture.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1s
      timeout: 5s
      retries: 30

  postgrest:
    image: postgrest/postgrest:v16.5
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${POSTGREST_PORT:-3901}:3000"
    environment:
      PGRST_DB_URI: postgres://authenticator:authenticator@db:5432/postgres
      PGRST_DB_SCHEMAS: api,tenant2
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: e2e-secret-that-is-at-least-32-characters-long
      PGRST_DB_PLAN_ENABLED: "true"
      PGRST_DB_AGGREGATES_ENABLED: "true"
      PGRST_DB_TX_END: commit-allow-override
      PGRST_DB_MAX_ROWS: "1000"

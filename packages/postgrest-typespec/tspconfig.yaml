emit:
  - "@typespec/openapi3"
  - "@typespec/http-client-js"
options:
  "@typespec/openapi3":
    emitter-output-dir: "{project-root}/openapi"
    output-file: "openapi.yaml"
  "@typespec/http-client-js":
    emitter-output-dir: "{project-root}/clients/js"
    package-name: "@supabase/postgrest-typespec-client"

            Preference-Applied:
              required: false
              description: Preferences from the `Prefer` header that the server applied.
              schema:
                type: string
            Content-Range:
              required: false
              description: Range of the returned or affected rows, and the total when counted.
              schema:
                $ref: '#/components/schemas/ContentRange'
            Range-Unit:
              required: false
              description: Unit of `Content-Range`.
              schema:
                type: string
                enum:
                  - items
        '206':
          description: Successful
          headers:
            Preference-Applied:
              required: false
              description: Preferences from the `Prefer` header that the server applied.
              schema:
                type: string
            Content-Range:
              required: false
              description: Range of the returned or affected rows, and the total when counted.
              schema:
                $ref: '#/components/schemas/ContentRange'
            Range-Unit:

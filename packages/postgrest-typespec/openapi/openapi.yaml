  /rpc/{function}:
    get:
      operationId: Functions_call
      summary: Call a function with GET
      description: |-
        Calls a STABLE or IMMUTABLE function with GET. The query string carries
        the arguments, plus filters, ordering and pagination for a table-valued
        result.
      parameters:
        - $ref: '#/components/parameters/FunctionPath'
        - $ref: '#/components/parameters/SelectParameter'
        - $ref: '#/components/parameters/PaginationParameters.order'
        - $ref: '#/components/parameters/PaginationParameters.limit'
        - $ref: '#/components/parameters/PaginationParameters.offset'
        - $ref: '#/components/parameters/ResultParameters.or'
        - $ref: '#/components/parameters/ResultParameters.and'
        - $ref: '#/components/parameters/ResultParameters.notOr'
        - $ref: '#/components/parameters/ResultParameters.notAnd'
        - name: arguments
          in: query
          required: false
          description: |-
            Function arguments and horizontal filters, one query parameter per
            entry. A key that names a function parameter is an argument (repeat it
            for a variadic argument, and pass arrays as literals such as
            `{1,2,3}`). Any other key is a filter on a table-valued result, with the
            same grammar as `FilterParameters`.
          schema:
            type: object
            additionalProperties:
              type: string
        - name: Accept
          in: header
          required: false
          description: Media type(s) of the response.
          schema:
            $ref: '#/components/schemas/AcceptMediaType'
        - name: Accept-Profile
          in: header
          required: false
          description: |-
            Schema to read from, when the server exposes several schemas
            (`db-schemas`). Defaults to the first schema. An unknown schema fails with
            PGRST106.
          schema:
            type: string
        - name: Range
          in: header
          required: false
          description: |-
            Rows to return. An alternative to the `limit` and `offset` query
            parameters. An invalid range fails with PGRST103 (416).
          schema:
            $ref: '#/components/schemas/ItemRange'
        - name: Range-Unit
          in: header
          required: false
          description: Unit of `Range`. Only `items` is supported.
          schema:
            type: string
            enum:
              - items
        - name: Prefer
          in: header
          required: false
          description: Preferences for this request.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/FunctionPreference'
      responses:
        '200':
          description: 'Function result as JSON: a scalar, an object, or an array of rows.'
          headers:
            Preference-Applied:
              required: false
              description: Preferences from the `Prefer` header that the server applied.
              schema:
                type: string
            Content-Range:
              required: false
              description: Range of the returned or affected rows, and the total when counted.
              schema:
                $ref: '#/components/schemas/ContentRange'
            Range-Unit:
              required: false
              description: Unit of `Content-Range`.
              schema:
                type: string
                enum:
                  - items
          content:
            application/json:
              schema: {}
            application/vnd.pgrst.array+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Row'
            application/vnd.pgrst.object+json:
              schema:
                $ref: '#/components/schemas/Row'
            text/csv:
              schema:
                type: string
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJsonFeatureCollection'
            application/vnd.pgrst.plan+text:
              schema:
                type: string
            application/vnd.pgrst.plan+json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: {}
            '*/*':
              schema:
                type: string
                format: binary
        '204':
          description: The function returns `void`.
          headers:
            Preference-Applied:
              required: false
              description: Preferences from the `Prefer` header that the server applied.
              schema:
                type: string
        '206':
          description: 'Function result as JSON: a scalar, an object, or an array of rows.'
          headers:
            Preference-Applied:
              required: false
              description: Preferences from the `Prefer` header that the server applied.
              schema:
                type: string
            Content-Range:
              required: false
              description: Range of the returned or affected rows, and the total when counted.
              schema:
                $ref: '#/components/schemas/ContentRange'
            Range-Unit:
              required: false
              description: Unit of `Content-Range`.
              schema:
                type: string
                enum:
                  - items
          content:
            application/json:
              schema: {}
            application/vnd.pgrst.array+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Row'
            application/vnd.pgrst.object+json:
              schema:
                $ref: '#/components/schemas/Row'
            text/csv:
              schema:
                type: string
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJsonFeatureCollection'
            application/vnd.pgrst.plan+text:
              schema:
                type: string
            application/vnd.pgrst.plan+json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: {}
            '*/*':
              schema:
                type: string
                format: binary
        '300':
          description: Ambiguous embedding (PGRST201) or ambiguous overloaded function (PGRST203).
          headers:
            Proxy-Status:
              required: false
              description: |-
                Proxy status (RFC 9209) with the error code. Useful for HEAD requests,
                which have no body.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgrestError'
        '400':
          description: |-
            Invalid request (PGRST1xx, PGRST200, PGRST204), or a database error without

                Proxy status (RFC 9209) with the error code. Useful for HEAD requests,
                which have no body.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgrestError'
        '401':
          description: |-
            Invalid or missing JWT (PGRST301 to PGRST303), or insufficient privileges

security:
  - BearerAuth: []
  - {}
components:
  parameters:
    ColumnsParameter:
      name: columns
      in: query
      required: false
      description: |-
        Payload keys to write. Other keys in the payload are ignored. Keys missing
        from a row get NULL, or the column DEFAULT with `Prefer: missing=default`.
        An unknown column fails with PGRST204.
      schema:
        $ref: '#/components/schemas/ColumnList'
      explode: false
    FilterParameters.and:
      name: and
      in: query
      required: false
      description: All conditions hold.
      schema:
        $ref: '#/components/schemas/LogicalExpression'
      explode: false
    FilterParameters.filters:
      name: filters
      in: query
      required: false
      description: |-
        Filters and embedded resource parameters. Each entry is one query
        parameter. The key is one of:

        - `<field>`: a column, JSON/composite path (`json_data->>blood_type`) or
        computed field. The value is a `FilterExpression`, such as `age=gte.18`.
        Repeat the key to apply several conditions to the same field.
        - `<embedded>`: an embedded resource from `select`. Only `is.null` and
        `not.is.null` are allowed, for example `actors=not.is.null`.
        - `<embedded>.<field>`: a filter on an embedded resource, such as
        `actors.first_name=eq.Jehanne`. Nested embeddings chain with `.`:
        `roles.actors.first_name=like.*Tom*`.
        - `<embedded>.order`, `<embedded>.limit`, `<embedded>.offset`: ordering
        and pagination of an embedded resource. The value is an `OrderList` or a
        `RowCount`.
        - `<embedded>.or`, `<embedded>.and`, `<embedded>.not.or`,
        `<embedded>.not.and`: logical operators on an embedded resource. The
        value is a `LogicalExpression`.

        Filters on an embedded resource do not remove parent rows unless the
        embedding uses `!inner` or the parent filters on `<embedded>=not.is.null`.
      schema:
        type: object
        additionalProperties:
          type: string
    FilterParameters.notAnd:
      name: not.and
      in: query
      required: false
      description: Not all of the conditions hold.
      schema:
        $ref: '#/components/schemas/LogicalExpression'
      explode: false
    FilterParameters.notOr:
      name: not.or
      in: query
      required: false
      description: Not all of the conditions hold.
      schema:
        $ref: '#/components/schemas/LogicalExpression'
      explode: false
    FilterParameters.or:
      name: or
      in: query
      required: false
      description: At least one of the conditions holds.
      schema:
        $ref: '#/components/schemas/LogicalExpression'
      explode: false
    FunctionPath:
      name: function
      in: path
      required: true
      description: Function in the selected schema.
      schema:
        $ref: '#/components/schemas/ResourceName'
    OnConflictParameter:
      name: on_conflict
      in: query
      required: false
      description: |-
        Columns of a UNIQUE constraint to use as the upsert conflict target,
        instead of the primary key. Used with `Prefer: resolution=...`.
      schema:
        $ref: '#/components/schemas/ColumnList'
      explode: false
    PaginationParameters.limit:
      name: limit
      in: query
      required: false
      description: Maximum number of rows to return. The server caps it at `db-max-rows`.
      schema:
        $ref: '#/components/schemas/RowCount'
      explode: false
    PaginationParameters.offset:
      name: offset
      in: query
      required: false
      description: Number of rows to skip.
      schema:
        $ref: '#/components/schemas/RowCount'
      explode: false
    PaginationParameters.order:
      name: order
      in: query
      required: false
      description: Row order.
      schema:
        $ref: '#/components/schemas/OrderList'
      explode: false
    RelationPath:
      name: relation
      in: path
      required: true
      description: Table or view in the selected schema.
      schema:
        $ref: '#/components/schemas/ResourceName'
    ResultParameters.and:
      name: and
      in: query
      required: false
      description: All conditions hold.
      schema:
        $ref: '#/components/schemas/LogicalExpression'
      explode: false
    ResultParameters.notAnd:
      name: not.and
      in: query
      required: false
      description: Not all of the conditions hold.
      schema:
        $ref: '#/components/schemas/LogicalExpression'
      explode: false
    ResultParameters.notOr:
      name: not.or
      in: query
      required: false
      description: Not all of the conditions hold.
      schema:
        $ref: '#/components/schemas/LogicalExpression'
      explode: false
    ResultParameters.or:
      name: or
      in: query
      required: false
      description: At least one of the conditions holds.
      schema:
        $ref: '#/components/schemas/LogicalExpression'
      explode: false
    SelectParameter:
      name: select
      in: query
      required: false
      description: |-
        Fields to return. On writes it shapes the representation returned with
        `Prefer: return=representation`.
      schema:
        $ref: '#/components/schemas/SelectList'
      explode: false
  schemas:
    AcceptMediaType:
      anyOf:
        - type: string
          enum:
            - application/json
            - text/csv
            - application/vnd.pgrst.object+json
            - application/vnd.pgrst.array+json
            - application/vnd.pgrst.array+json;nulls=stripped
            - application/geo+json
            - application/vnd.pgrst.plan
            - application/vnd.pgrst.plan+text
            - application/vnd.pgrst.plan+json
            - application/openapi+json
            - '*/*'
        - type: string
      description: |-
        Media types for the `Accept` request header. Any other value selects a media
        type handler defined in the database, and fails with PGRST107 when none
        exists. The header can list several media types with quality values.
    AggregateFunction:
      type: string
      enum:
        - avg
        - count
        - max
        - min
        - sum
      description: Aggregate functions usable in a `SelectList` as `<field>.<function>()`.
    ColumnList:
      type: string
      description: Comma-separated list of column names.
      example: source,publication_date,figure
    CommonPreference:
      anyOf:
        - $ref: '#/components/schemas/HandlingPreference'
        - $ref: '#/components/schemas/TimezonePreference'
        - $ref: '#/components/schemas/TxPreference'
      description: Preferences accepted by every request.
    ContentRange:
      type: string
      pattern: ^(\*|[0-9]+-[0-9]+)/(\*|[0-9]+)$
      description: |-
        Range of the returned rows and, when a count was requested, the total:
        `<first>-<last>/<total>`. The range is `*` when no rows were returned, and
        the total is `*` when no count was requested.
      example: 0-24/3573458
    CountPreference:
      type: string
      enum:
        - count=exact
        - count=planned
        - count=estimated
      description: Asks for the total number of rows, returned as the total in `Content-Range`.
    DeletePreference:
      anyOf:
        - $ref: '#/components/schemas/CommonPreference'
        - $ref: '#/components/schemas/CountPreference'
        - $ref: '#/components/schemas/ReturnPreference'
        - $ref: '#/components/schemas/MaxAffectedPreference'
      description: Preferences accepted by DELETE on tables and views.
    EmbeddingJoinType:
      type: string
      enum:
        - inner
        - left
      description: |-
        Join type hint for an embedded resource: `actors!inner(*)`. Without a hint,
        embedding is a left join.
    ErrorCode:
      anyOf:
        - type: string
          enum:
            - PGRST000
            - PGRST001
            - PGRST002
            - PGRST003
            - PGRST100
            - PGRST101
            - PGRST102
            - PGRST103
            - PGRST105
            - PGRST106
            - PGRST107
            - PGRST108
            - PGRST111
            - PGRST112
            - PGRST114
            - PGRST115
            - PGRST116
            - PGRST117
            - PGRST118
            - PGRST120
            - PGRST121
            - PGRST122
            - PGRST123
            - PGRST124
            - PGRST125
            - PGRST126
            - PGRST127
            - PGRST128
            - PGRST129
            - PGRST200
            - PGRST201
            - PGRST202
            - PGRST203
            - PGRST204
            - PGRST205
            - PGRST300
            - PGRST301
            - PGRST302
            - PGRST303
            - PGRSTX00
        - type: string
      description: |-
        Error code. PostgREST codes have the form `PGRST<group><id>`. Other values
        are PostgreSQL SQLSTATE codes forwarded from the database (for example
        `23505`), or custom codes raised by database functions (`PT402`, or any code
        raised with SQLSTATE `PGRST`).
    FilterExpression:
      type: string
      description: |-
        Horizontal filter applied to a column, a JSON/composite path or a computed
        field, sent as the value of the query parameter named after that field.

        Grammar: `[not.]<operator>[(<modifier>)].<value>`

        - `<operator>` is a `FilterOperator`.
        - `<modifier>` is either an `OperatorModifier` (`like(any).{O*,P*}`) or, for
        the full-text search operators, a text search configuration
        (`fts(french).amusant`).
        - `<value>` is the operand. `in` takes a parenthesized list
        (`in.(1,2,3)`), `cs`/`cd`/`ov` take array or range literals
        (`cs.{a,b}`, `ov.[2017-01-01,2017-06-30]`), `is` takes an `IsValue`. In
        `like` and `ilike` patterns `*` is an alias of `%`. Wrap values with
        reserved characters in double quotes and escape `"` and `\` with `\`.

        On an embedded resource name (for example `actors=not.is.null`) only
        `is.null` and `not.is.null` are allowed.
      example: not.in.(1,2,3)
    FilterOperator:
      type: string
      enum:
        - eq
        - gt
        - gte
        - lt
        - lte
        - neq
        - like
        - ilike
        - match
        - imatch
        - in
        - is
        - isdistinct
        - fts
        - plfts
        - phfts
        - wfts
        - cs
        - cd
        - ov
        - sl
        - sr
        - nxr
        - nxl
        - adj
      description: Filter operators accepted in a `FilterExpression`.
    FunctionPreference:
      anyOf:
        - $ref: '#/components/schemas/CommonPreference'
        - $ref: '#/components/schemas/CountPreference'
        - $ref: '#/components/schemas/MaxAffectedPreference'
      description: Preferences accepted by function calls.
    GeoJsonFeatureCollection:
      type: object
      required:
        - type
        - features
      properties:
        type:
          type: string
          enum:
            - FeatureCollection
        features:
          type: array
          items:
            type: object
            additionalProperties: {}
      description: A GeoJSON FeatureCollection (RFC 7946).
    HandlingPreference:
      type: string
      enum:
        - handling=lenient
        - handling=strict
      description: |-
        How the server treats invalid or unfulfillable preferences. `lenient` (the
        default) ignores them. `strict` rejects the request with PGRST122.
    InsertPreference:
      anyOf:
        - $ref: '#/components/schemas/CommonPreference'
        - $ref: '#/components/schemas/CountPreference'
        - $ref: '#/components/schemas/ReturnPreference'
        - $ref: '#/components/schemas/ResolutionPreference'
        - $ref: '#/components/schemas/MissingPreference'
      description: Preferences accepted by POST on tables and views (insert and upsert).
    IsValue:
      type: string
      enum:
        - 'null'
        - not_null
        - 'true'
        - 'false'
        - unknown
      description: Operands of the `is` operator.
    ItemRange:
      type: string
      pattern: ^[0-9]+-[0-9]*$
      description: |-
        Item range for pagination, as `<first>-<last>` or the open-ended
        `<first>-`. Indexes are zero-based and inclusive.
      example: 0-19
    LogicalExpression:
      type: string
      description: |-
        Value of a logical operator query parameter (`or`, `and`, `not.or`,
        `not.and`, and their embedded forms such as `actors.or`): a parenthesized,
        comma-separated list of conditions.

        Each condition is either `<field>.<filter expression>` (for example
        `age.lt.18`, `age.not.in.(1,2)`) or a nested logical operator
        (`not.and(age.gte.11,age.lte.17)`). An embedded resource can be tested for
        existence with `<embedded>.is.null` or `<embedded>.not.is.null`.
      example: (age.eq.14,not.and(age.gte.11,age.lte.17))
    LogicalOperator:
      type: string
      enum:
        - and
        - or
      description: Logical operators, used as query parameter names.
    MaxAffectedPreference:
      type: string
      pattern: ^max-affected=[0-9]+$
      description: |-
        Upper bound for the number of rows a PATCH, DELETE or table-valued function
        call can affect. Enforced only with `handling=strict`. Exceeding it fails
        with PGRST124.
      example: max-affected=10
    MissingPreference:
      type: string
      enum:
        - missing=default
      description: |-
        Value for columns missing from the payload. The default is NULL. With
        `missing=default` the column DEFAULT is used.
    NullsOrder:
      type: string
      enum:
        - nullsfirst
        - nullslast
      description: Placement of NULL values in an `OrderList`.
    OpenApiDocument:
      type: object
      additionalProperties: {}
      description: |-
        OpenAPI 2.0 (Swagger) description of the selected schema, generated from the
        schema cache, or the result of the `db-root-spec` function when set.
    OperatorModifier:
      type: string
      enum:
        - any
        - all
      description: |-
        Modifiers that apply an operator to every value in a list:
        `last_name=like(any).{O*,P*}`. Valid on `eq`, `like`, `ilike`, `gt`, `gte`,
        `lt`, `lte`, `match` and `imatch`.
    OrderDirection:
      type: string
      enum:
        - asc
        - desc
      description: Sort directions in an `OrderList`.
    OrderList:
      type: string
      description: |-
        Comma-separated list of ordering terms. Each term is
        `<field>[.asc|.desc][.nullsfirst|.nullslast]`, where `<field>` is a column, a
        JSON/composite path (`location->>lat`) or, on a to-one embedded resource, an
        embedded column (`directors(last_name)`). The default direction is ascending.
      example: age.desc.nullslast,height
    PostgrestError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        details:
          type: string
          nullable: true
        hint:
          type: string
          nullable: true
      description: |-
        Error body. It follows the PostgreSQL error structure. With
        `client-error-verbosity=minimal` only `code` and `message` are present.
    PutPreference:
      anyOf:
        - $ref: '#/components/schemas/CommonPreference'
        - $ref: '#/components/schemas/ReturnPreference'
      description: Preferences accepted by PUT on tables and views (single row upsert).
    ReadPreference:
      anyOf:
        - $ref: '#/components/schemas/CommonPreference'
        - $ref: '#/components/schemas/CountPreference'
      description: Preferences accepted by reads (GET and HEAD) on tables and views.
    ResolutionPreference:
      type: string
      enum:
        - resolution=merge-duplicates
        - resolution=ignore-duplicates
      description: Upsert behavior on a primary key or `on_conflict` conflict.
    ResourceName:
      type: string
      minLength: 1
      description: |-
        Name of a table, view or function in the exposed schema, as it appears in the
        URL. Names are case sensitive. Percent-encode spaces and non-ASCII characters
        (`Order%20Items`, `%D9%85%D9%88%D8%A7%D8%B1%D8%AF`).
      example: people
    ReturnPreference:
      type: string
      enum:
        - return=minimal
        - return=headers-only
        - return=representation
      description: What a write request returns.
    Row:
      type: object
      additionalProperties: {}
      description: |-
        A row of a table, view or table-valued function, as a JSON object keyed by
        column name. Its shape depends on the database schema and on `select`
        (aliases, casts, JSON paths, aggregates and embedded resources).
    RowCount:
      type: integer
      format: int64
      minimum: 0
      description: Number of rows.
    SelectList:
      type: string
      description: |-
        Vertical filtering: the comma-separated list of fields to return. Defaults to
        `*` (all columns).

        Each item is one of:

        - a column or computed field: `first_name`, `*`
        - a JSON, composite or array path with `->` (JSON) and `->>` (text):
        `json_data->phones->0->>number`
        - an aliased item: `fullName:full_name`
        - a cast item: `salary::text`
        - an aggregate (when `db-aggregates-enabled`): `amount.sum()`, `amount.avg()::int`,
        `count()`. See `AggregateFunction`. Non-aggregated items become the GROUP BY.
        - an embedded resource with its own select list:
        `directors(id,last_name)`, `director:directors(*)`, `directors()` (embed
        used only for filtering, not returned)
        - an embedding hint to pick a foreign key, column or join table, and an
        optional join type: `addresses!billing(name)`, `actors!inner(*)`,
        `clients!client_id!left(*)`. See `EmbeddingJoinType`.
        - a spread embedded resource whose fields are lifted into the parent object:
        `...directors(first_name)`. On a to-many relationship each field becomes an
        array.

        Wrap identifiers that contain reserved characters (`,` `.` `:` `*` `(` `)`)
        in double quotes.
      example: id,fullName:full_name,salary::text,director:directors!inner(id,last_name)
    TimezonePreference:
      type: string
      pattern: ^timezone=.+$
      description: |-
        Time zone for the transaction: any name in `pg_timezone_names` or a numeric
        offset such as `05:30` or `-03:00`. An invalid time zone is always an error,
        also with `handling=lenient`.
      example: timezone=America/Los_Angeles
    TxPreference:
      type: string
      enum:
        - tx=commit
        - tx=rollback
      description: |-
        Whether the transaction ends in COMMIT or ROLLBACK. The server honors it only
        when `db-tx-end` allows it.
    UpdatePreference:
      anyOf:
        - $ref: '#/components/schemas/CommonPreference'
        - $ref: '#/components/schemas/CountPreference'
        - $ref: '#/components/schemas/ReturnPreference'
        - $ref: '#/components/schemas/MissingPreference'
        - $ref: '#/components/schemas/MaxAffectedPreference'
      description: Preferences accepted by PATCH on tables and views.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
servers:
  - url: '{baseUrl}'
    description: A PostgREST server
    variables:
      baseUrl:
        default: http://localhost:3000

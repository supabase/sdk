            Proxy-Status:
              required: false
              description: |-
                Proxy status (RFC 9209) with the error code. Useful for HEAD requests,
                which have no body.
              schema:
                type: string
        '400':
          description: |-
            Error of a HEAD request. There is no body; `Proxy-Status` carries the error
            code.
          headers:
            Proxy-Status:
              required: false
              description: |-
                Proxy status (RFC 9209) with the error code. Useful for HEAD requests,
                which have no body.
              schema:
                type: string
        '401':
          description: |-
            Error of a HEAD request. There is no body; `Proxy-Status` carries the error
            code.
          headers:
            Proxy-Status:

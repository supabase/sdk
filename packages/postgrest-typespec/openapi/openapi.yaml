          headers:
            Proxy-Status:
              required: false
              description: |-
                Proxy status (RFC 9209) with the error code. Useful for HEAD requests,
                which have no body.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgrestError'
        '405':
          description: Method not allowed for the resource (PGRST101, PGRST105, PGRST117, 25006).
          headers:
            Proxy-Status:
              required: false
              description: |-
                Proxy status (RFC 9209) with the error code. Useful for HEAD requests,
                which have no body.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgrestError'
        '406':
          description: Unknown schema (PGRST106), unavailable media type (PGRST107), or not exactly one row for a singular response (PGRST116).
          headers:
            Proxy-Status:
              required: false
              description: |-
                Proxy status (RFC 9209) with the error code. Useful for HEAD requests,
                which have no body.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgrestError'
        '416':
          description: Invalid range (PGRST103).
          headers:
            Proxy-Status:
              required: false
              description: |-
                Proxy status (RFC 9209) with the error code. Useful for HEAD requests,
                which have no body.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgrestError'
        '500':
          description: Server or database error.
          headers:
            Proxy-Status:
              required: false
              description: |-
                Proxy status (RFC 9209) with the error code. Useful for HEAD requests,
                which have no body.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgrestError'
        '503':
          description: The database is unavailable (PGRST000 to PGRST002, 08*, 53*).
          headers:
            Proxy-Status:
              required: false
              description: |-
                Proxy status (RFC 9209) with the error code. Useful for HEAD requests,
                which have no body.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgrestError'
        '504':
          description: Timed out waiting for a database connection (PGRST003).
          headers:
            Proxy-Status:
              required: false
              description: |-
                Proxy status (RFC 9209) with the error code. Useful for HEAD requests,
                which have no body.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgrestError'
        default:
          description: |-
            Any other status. Database functions can respond with any status by raising
            SQLSTATE `PTxyz` (status `xyz`), or SQLSTATE `PGRST` with the status in the
            error detail.
          headers:
            Proxy-Status:
              required: false
              description: |-
                Proxy status (RFC 9209) with the error code. Useful for HEAD requests,
                which have no body.
              schema:
                type: string
          content:

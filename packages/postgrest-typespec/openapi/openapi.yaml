openapi: 3.0.0
info:
  title: PostgREST
  version: '16'
  license:
    name: MIT
    url: https://github.com/PostgREST/postgrest/blob/main/LICENSE
  description: |-
    The HTTP API that every PostgREST server exposes, independent of the database
    schema behind it.

    PostgREST serves each table, view and function of the exposed schema(s) as a
    resource. The resource names, columns and function arguments depend on the
    database, so this model treats them as opaque: rows are JSON objects, filters
    are query parameters keyed by column name, and function arguments are JSON
    object keys or query parameters keyed by argument name. Everything that does
    not depend on the schema (the URL grammar, headers, preferences, media types,
    status codes and errors) is modeled precisely.

    Reference: https://docs.postgrest.org/en/v16/references/api.html
tags:
  - name: OpenAPI
    description: The schema-specific OpenAPI description that PostgREST generates.
  - name: Functions
    description: Functions of the exposed schema, called as RPC.
  - name: Tables and Views
    description: Tables, views and foreign tables of the exposed schema.
paths:
  /:
    get:
      operationId: Root_describe
      summary: Get the OpenAPI description
      description: Returns the OpenAPI description of the selected schema.
      parameters:
        - name: Accept
          in: header
          required: false
          description: Media type(s) of the response.
          schema:
            $ref: '#/components/schemas/AcceptMediaType'
        - name: Accept-Profile
          in: header
          required: false
          description: |-
            Schema to read from, when the server exposes several schemas
            (`db-schemas`). Defaults to the first schema. An unknown schema fails with
            PGRST106.
          schema:
            type: string
      responses:
        '200':
          description: The OpenAPI description.
          headers:
            Preference-Applied:
              required: false
              description: Preferences from the `Prefer` header that the server applied.
              schema:
                type: string
          content:
            application/openapi+json:
              schema:
                $ref: '#/components/schemas/OpenApiDocument'
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApiDocument'
        '400':
          description: |-
            Invalid request (PGRST1xx, PGRST200, PGRST204), or a database error without
            a more specific mapping, such as a constraint violation or `RAISE` (P0001).
          headers:
            Proxy-Status:
              required: false
              description: |-
                Proxy status (RFC 9209) with the error code. Useful for HEAD requests,
                which have no body.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgrestError'
        '401':
          description: |-
            Invalid or missing JWT (PGRST301 to PGRST303), or insufficient privileges
            (42501) for an anonymous request.
          headers:
            Proxy-Status:
              required: false
              description: |-
                Proxy status (RFC 9209) with the error code. Useful for HEAD requests,
                which have no body.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgrestError'
        '403':
          description: Insufficient privileges (42501) for an authenticated request.
          headers:
            Proxy-Status:
              required: false
              description: |-
                Proxy status (RFC 9209) with the error code. Useful for HEAD requests,
                which have no body.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgrestError'
        '404':
          description: |-
            Unknown table, view or function (PGRST202, PGRST205, 42P01, 42883), or an
            invalid path (PGRST125).
          headers:
            Proxy-Status:
              required: false
              description: |-
                Proxy status (RFC 9209) with the error code. Useful for HEAD requests,
                which have no body.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgrestError'
        '405':
          description: Method not allowed for the resource (PGRST101, PGRST105, PGRST117, 25006).
          headers:
            Proxy-Status:
              required: false
              description: |-
                Proxy status (RFC 9209) with the error code. Useful for HEAD requests,
                which have no body.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgrestError'
        '406':
          description: Unknown schema (PGRST106), unavailable media type (PGRST107), or not exactly one row for a singular response (PGRST116).
          headers:
            Proxy-Status:
              required: false
              description: |-
                Proxy status (RFC 9209) with the error code. Useful for HEAD requests,
                which have no body.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgrestError'
        '500':
          description: Server or database error.
          headers:
            Proxy-Status:
              required: false
              description: |-
                Proxy status (RFC 9209) with the error code. Useful for HEAD requests,
                which have no body.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgrestError'
        '503':
          description: The database is unavailable (PGRST000 to PGRST002, 08*, 53*).
          headers:
            Proxy-Status:
              required: false
              description: |-
                Proxy status (RFC 9209) with the error code. Useful for HEAD requests,
                which have no body.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgrestError'
        '504':
          description: Timed out waiting for a database connection (PGRST003).
          headers:
            Proxy-Status:
              required: false
              description: |-
                Proxy status (RFC 9209) with the error code. Useful for HEAD requests,
                which have no body.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgrestError'
        default:
          description: |-
            Any other status. Database functions can respond with any status by raising
            SQLSTATE `PTxyz` (status `xyz`), or SQLSTATE `PGRST` with the status in the
            error detail.
          headers:
            Proxy-Status:
              required: false
              description: |-
                Proxy status (RFC 9209) with the error code. Useful for HEAD requests,
                which have no body.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgrestError'
      tags:
        - OpenAPI
    head:
      operationId: Root_describeHead
      summary: Get the OpenAPI description headers
      description: Same as `describe`, without a response body.
      parameters:
        - name: Accept
          in: header
          required: false
          description: Media type(s) of the response.
